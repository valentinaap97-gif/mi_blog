{% extends 'base.html' %}

{% block title %}Registro{% endblock %}

{% block content %}
<h1 class="mb-4">Crear cuenta</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Registrarme</button>
</form>

<p class="mt-3">¿Ya tenés cuenta? <a href="{% url 'login' %}">Iniciá sesión</a></p>
{% endblock %}
